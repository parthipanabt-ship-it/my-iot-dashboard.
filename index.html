<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Live Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: white; text-align: center; padding: 20px; }
        h1 { color: #0f3460; background: #e94560; display: inline-block; padding: 10px 20px; border-radius: 10px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: #16213e; border: 2px solid #0f3460; border-radius: 15px; width: 180px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: #e94560; }
        .label { font-size: 0.9rem; color: #95a5a6; text-transform: uppercase; }
        .value { font-size: 1.8rem; font-weight: bold; margin: 10px 0; color: #00d4ff; }
        .unit { font-size: 1rem; color: #e94560; }
        #status-bar { margin-bottom: 20px; font-size: 0.8rem; color: #2ecc71; }
        .raw-data { margin-top: 40px; font-size: 0.7rem; color: #555; }
    </style>
</head>
<body>

    <h1>SMART MONITOR V1.0</h1>
    <div id="status-bar">Status: Disconnected</div>

    <div class="container">
        <div class="card">
            <div class="label">Temperature</div>
            <div class="value" id="temp">--</div>
            <div class="unit">°C</div>
        </div>
        <div class="card">
            <div class="label">Pressure</div>
            <div class="value" id="pres">--</div>
            <div class="unit">hPa</div>
        </div>
        <div class="card">
            <div class="label">Voltage</div>
            <div class="value" id="volt">--</div>
            <div class="unit">V</div>
        </div>
        <div class="card">
            <div class="label">Current</div>
            <div class="value" id="curr">--</div>
            <div class="unit">A</div>
        </div>
        <div class="card">
            <div class="label">Speed Status</div>
            <div class="value" id="speed" style="font-size: 1.2rem;">WAITING</div>
        </div>
    </div>

    <div class="raw-data">Raw Log: <span id="raw">None</span></div>

    <script>
        // --- CONFIGURATION ---
        const MQTT_BROKER = "broker.hivemq.com";
        const MQTT_PORT = 8000; // WebSocket Port
        const MQTT_TOPIC = "iot_pro_77/sensors/data"; // MUST MATCH ESP8266 TOPIC
        const CLIENT_ID = "web_client_" + Math.floor(Math.random() * 10000);

        const client = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, CLIENT_ID);

        // Connection Handlers
        client.onConnectionLost = (responseObject) => {
            document.getElementById("status-bar").innerText = "Status: Connection Lost! Retrying...";
            document.getElementById("status-bar").style.color = "#e74c3c";
            setTimeout(() => client.connect({onSuccess: onConnect}), 5000);
        };

        client.onMessageArrived = (message) => {
            const payload = message.payloadString;
            document.getElementById("raw").innerText = payload;

            // Simple Parsing Logic for string: "T:25.0 P:1013.2 V:12.5 I:0.5 Speed:CLEAR"
            try {
                const parts = payload.split(" ");
                parts.forEach(part => {
                    if(part.startsWith("T:")) document.getElementById("temp").innerText = part.split(":")[1];
                    if(part.startsWith("P:")) document.getElementById("pres").innerText = part.split(":")[1];
                    if(part.startsWith("V:")) document.getElementById("volt").innerText = part.split(":")[1];
                    if(part.startsWith("I:")) document.getElementById("curr").innerText = part.split(":")[1];
                    if(part.startsWith("Speed:")) {
                        let s = part.split(":")[1];
                        document.getElementById("speed").innerText = s;
                        document.getElementById("speed").style.color = (s === "CLEAR") ? "#2ecc71" : "#e74c3c";
                    }
                });
            } catch (e) { console.error("Parsing error:", e); }
        };

        const onConnect = () => {
            document.getElementById("status-bar").innerText = "Status: Live & Connected";
            document.getElementById("status-bar").style.color = "#2ecc71";
            client.subscribe(MQTT_TOPIC);
        };

        client.connect({ onSuccess: onConnect, useSSL: false });
    </script>
</body>
</html>
